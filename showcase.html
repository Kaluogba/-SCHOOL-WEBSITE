<!DOCTYPE html>
<html lang="en">
<head>

    <style>

        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        .video-card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .video-card h3 { margin-top: 0; font-size: 1.1rem; color: #34495e; }
        iframe { width: 100%; height: 250px; border-radius: 8px; border: none; }
    </style>
</head>
<body>
    <h1>📚 Freshly Added Curriculum Videos</h1>
    <div class="gallery">
        <div class="video-card">
            <h3>Basic Concepts of Economics</h3>
            <iframe src="https://www.youtube.com/embed/2dR8cxGUV4Y?autoplay=0" allowfullscreen></iframe>
        </div>
        <div class="video-card">
            <h3>Federalism and Local Government</h3>
            <iframe src="https://www.youtube.com/embed/Zit8F4ssPIQ?autoplay=0" allowfullscreen></iframe>
        </div>
        <div class="video-card">
            <h3>Logic Circuits and Computing</h3>
            <iframe src="https://www.youtube.com/embed/b-9nGVd2xjA?autoplay=0" allowfullscreen></iframe>
        </div>
        <div class="video-card">

    </div>
</body>
</html>
